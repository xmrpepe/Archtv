# ArchDock Alacritty – Omarchy's terminal config, sized for a TV.
# Colours live in theme.toml, rewritten by archdock-theme-set (live reload).
general.import = [ "~/.config/alacritty/theme.toml" ]
general.live_config_reload = true

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 11

[window]
padding.x = 14
padding.y = 14
decorations = "Full"
opacity = 0.97
dynamic_title = true

[cursor]
style = { shape = "Block", blinking = "Off" }

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" },
{ key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
]
